<svg xmlns="http://www.w3.org/2000/svg" width="760" height="204" viewBox="0 0 760 204" role="img" aria-labelledby="title description">
  <title id="title">Top languages</title>
  <desc id="description">A stacked bar showing TypeScript 39.54 percent, JavaScript 18.33 percent, Python 16.08 percent, Rust 14.03 percent, C++ 9.42 percent, and Other 2.60 percent.</desc>

  <style>
    .label {
      fill: #24292f;
      font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .value {
      fill: #57606a;
      font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .track {
      fill: #d8dee4;
    }

    @media (prefers-color-scheme: dark) {
      .label { fill: #f0f6fc; }
      .value { fill: #8c959f; }
      .track { fill: #30363d; }
    }
  </style>

  <defs>
    <clipPath id="bar-clip">
      <rect x="24" y="24" width="712" height="22" rx="11" />
    </clipPath>
  </defs>

  <rect class="track" x="24" y="24" width="712" height="22" rx="11" />
  <g clip-path="url(#bar-clip)">
    <rect x="24" y="24" width="281.52" height="22" fill="#3178c6" />
    <rect x="305.52" y="24" width="130.51" height="22" fill="#f1e05a" />
    <rect x="436.03" y="24" width="114.49" height="22" fill="#3572a5" />
    <rect x="550.52" y="24" width="99.90" height="22" fill="#dea584" />
    <rect x="650.42" y="24" width="67.07" height="22" fill="#f34b7d" />
    <rect x="717.49" y="24" width="18.51" height="22" fill="#8b949e" />
  </g>

  <g transform="translate(24 80)">
    <rect width="12" height="12" rx="3" fill="#3178c6" />
    <text class="label" x="22" y="11">TypeScript</text>
    <text class="value" x="322" y="11" text-anchor="end">39.54%</text>
  </g>
  <g transform="translate(398 80)">
    <rect width="12" height="12" rx="3" fill="#f1e05a" />
    <text class="label" x="22" y="11">JavaScript</text>
    <text class="value" x="338" y="11" text-anchor="end">18.33%</text>
  </g>

  <g transform="translate(24 124)">
    <rect width="12" height="12" rx="3" fill="#3572a5" />
    <text class="label" x="22" y="11">Python</text>
    <text class="value" x="322" y="11" text-anchor="end">16.08%</text>
  </g>
  <g transform="translate(398 124)">
    <rect width="12" height="12" rx="3" fill="#dea584" />
    <text class="label" x="22" y="11">Rust</text>
    <text class="value" x="338" y="11" text-anchor="end">14.03%</text>
  </g>

  <g transform="translate(24 168)">
    <rect width="12" height="12" rx="3" fill="#f34b7d" />
    <text class="label" x="22" y="11">C++</text>
    <text class="value" x="322" y="11" text-anchor="end">9.42%</text>
  </g>
  <g transform="translate(398 168)">
    <rect width="12" height="12" rx="3" fill="#8b949e" />
    <text class="label" x="22" y="11">Other</text>
    <text class="value" x="338" y="11" text-anchor="end">2.60%</text>
